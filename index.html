
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f7ff">
<title>Like-social</title>
<style>
:root {
  --blue: #4263eb;
  --blue-dark: #304bd0;
  --bg: #f5f7ff;
  --text: #202944;
  --muted: #78819a;
  --border: #e7eaf3;
  --white: #ffffff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, textarea { font: inherit; }
button { cursor: pointer; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(255,255,255,.96);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 20px;
  font-weight: 800;
}
.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  color: white;
  background: linear-gradient(135deg,#6485ff,#3450d5);
  box-shadow: 0 5px 12px #4263eb35;
  font-size: 15px;
  letter-spacing: -1px;
}
.logo span { color: var(--blue); }
.status {
  margin-left: auto;
  color: var(--muted);
  font-size: 12px;
}
main {
  width: min(100% - 28px, 560px);
  margin: 22px auto 40px;
}
.welcome {
  padding: 24px;
  border-radius: 24px;
  color: white;
  background: linear-gradient(130deg,#4568f0,#748bff);
  box-shadow: 0 10px 28px #4263eb25;
}
.welcome h1 { margin: 0 0 8px; font-size: 25px; }
.welcome p { margin: 0; line-height: 1.5; opacity: .93; }
.card {
  margin-top: 18px;
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--white);
  box-shadow: 0 5px 18px #20294408;
}
h2 { margin: 0 0 14px; font-size: 19px; }
label {
  display: block;
  margin: 12px 0 6px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}
input, textarea {
  width: 100%;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  outline: none;
  background: #fbfcff;
  color: var(--text);
}
input:focus, textarea:focus { border-color: var(--blue); }
textarea { resize: vertical; min-height: 95px; }
.primary {
  width: 100%;
  margin-top: 12px;
  padding: 13px;
  border: 0;
  border-radius: 12px;
  background: var(--blue);
  color: white;
  font-weight: 700;
}
.primary:active { background: var(--blue-dark); }
.feed-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 26px 2px 0;
}
.feed-title h2 { margin: 0; }
.count { color: var(--muted); font-size: 12px; }
.post { margin-top: 14px; }
.post-header {
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  border-radius: 50%;
  color: #304bd0;
  background: #e9edff;
  font-weight: 800;
}
.post-name { font-size: 14px; font-weight: 750; }
.post-date { margin-top: 4px; color: var(--muted); font-size: 12px; }
.post-text {
  margin: 17px 0;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.post-actions {
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.secondary {
  flex: 1;
  padding: 10px 8px;
  border: 1px solid var(--border);
  border-radius: 11px;
  color: #47516d;
  background: #fff;
  font-size: 13px;
  font-weight: 650;
}
.secondary.active { color: var(--blue); background: #eef1ff; }
.comments { margin-top: 12px; }
.comment {
  margin-top: 7px;
  padding: 10px;
  border-radius: 10px;
  background: #f6f7fc;
  font-size: 13px;
  overflow-wrap: anywhere;
}
.empty {
  padding: 28px 12px;
  text-align: center;
  color: var(--muted);
  line-height: 1.6;
}
footer {
  padding: 30px 0 10px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}
@media (prefers-color-scheme: dark) {
  /* Mantém o visual claro para facilitar a leitura nesta primeira versão. */
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">
    <div class="logo-mark">LS</div>
    <div>Like-<span>social</span></div>
  </div>
  <div class="status">Sua comunidade</div>
</header>

<main>
  <section class="welcome">
    <h1>Olá, seja bem-vindo!</h1>
    <p>Compartilhe suas ideias, converse e descubra novas publicações.</p>
  </section>

  <section class="card">
    <h2>Criar publicação</h2>
    <label for="username">Seu nome</label>
    <input id="username" maxlength="30" placeholder="Como você quer aparecer?">
    <label for="message">O que você está pensando?</label>
    <textarea id="message" maxlength="500" placeholder="Escreva algo para compartilhar..."></textarea>
    <button class="primary" id="publish">＋ Publicar</button>
  </section>

  <div class="feed-title">
    <h2>Feed</h2>
    <span class="count" id="post-count">0 publicações</span>
  </div>
  <section id="feed"></section>

  <footer>Like-social · Conecte-se e compartilhe.</footer>
</main>

<script>
const username = document.getElementById('username');
const message = document.getElementById('message');
const feed = document.getElementById('feed');
const postCount = document.getElementById('post-count');

let posts = [];
try {
  posts = JSON.parse(localStorage.getItem('like-social-v2') || '[]');
  if (!Array.isArray(posts)) posts = [];
} catch (error) {
  posts = [];
}

function savePosts() {
  try {
    localStorage.setItem('like-social-v2', JSON.stringify(posts));
    return true;
  } catch (error) {
    alert('O navegador não conseguiu salvar os dados.');
    return false;
  }
}

function renderPosts() {
  feed.replaceChildren();
  postCount.textContent =
    posts.length + (posts.length === 1 ? ' publicação' : ' publicações');

  if (posts.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'card empty';
    empty.textContent = 'Ainda não há publicações. Escreva a primeira e comece seu feed!';
    feed.appendChild(empty);
    return;
  }

  posts.forEach((post, index) => {
    const card = document.createElement('article');
    card.className = 'card post';

    const header = document.createElement('div');
    header.className = 'post-header';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = (post.name || '?').trim().charAt(0).toUpperCase();

    const details = document.createElement('div');
    const name = document.createElement('div');
    name.className = 'post-name';
    name.textContent = post.name || 'Usuário';

    const date = document.createElement('div');
    date.className = 'post-date';
    date.textContent = post.date || 'Agora';

    details.append(name, date);
    header.append(avatar, details);

    const text = document.createElement('p');
    text.className = 'post-text';
    text.textContent = post.message || '';

    const actions = document.createElement('div');
    actions.className = 'post-actions';

    const like = document.createElement('button');
    like.className = 'secondary' + (post.liked ? ' active' : '');
    like.textContent = '♥ Curtir (' + (post.likes || 0) + ')';
    like.setAttribute('aria-pressed', String(Boolean(post.liked)));

    like.addEventListener('click', () => {
      post.liked = !post.liked;
      post.likes = Math.max(0, (post.likes || 0) + (post.liked ? 1 : -1));
      savePosts();
      renderPosts();
    });

    const commentButton = document.createElement('button');
    commentButton.className = 'secondary';
    commentButton.textContent = 'Comentar';

    commentButton.addEventListener('click', () => {
      const answer = prompt('Escreva seu comentário (até 200 caracteres):');
      if (!answer || !answer.trim()) return;
      if (!Array.isArray(post.comments)) post.comments = [];
      post.comments.push(answer.trim().slice(0, 200));
      savePosts();
      renderPosts();
    });

    actions.append(like, commentButton);
    card.append(header, text, actions);

    if (Array.isArray(post.comments) && post.comments.length) {
      const comments = document.createElement('div');
      comments.className = 'comments';
      post.comments.forEach(value => {
        const comment = document.createElement('div');
        comment.className = 'comment';
        comment.textContent = 'Comentário: ' + value;
        comments.appendChild(comment);
      });
      card.appendChild(comments);
    }

    feed.appendChild(card);
  });
}

document.getElementById('publish').addEventListener('click', () => {
  const name = username.value.trim();
  const text = message.value.trim();

  if (!name || !text) {
    alert('Digite seu nome e o texto da publicação.');
    return;
  }

  posts.unshift({
    name: name.slice(0, 30),
    message: text.slice(0, 500),
    date: new Date().toLocaleString('pt-BR', {
      day: '2-digit',
      month: 'short',
      hour: '2-digit',
      minute: '2-digit'
    }),
    likes: 0,
    liked: false,
    comments: []
  });

  if (savePosts()) {
    message.value = '';
    renderPosts();
  } else {
    posts.shift();
    renderPosts();
  }
});

renderPosts();
</script>
</body>
</html>
